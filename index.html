<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio - Joanna Bartczak"
    />
    <title>Portfolio - Joanna Bartczak</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="showcase">
      <header class="showcase__header">
        <div>
          <h3>Joanna Bartczak</h3>
          <h1>Portfolio</h1>
          <p class="eyebrow"> Grafisk design · Visuell kommunikation · Illustration </p>
        </div>
      </header>
      <section class="gallery">
        <figure class="gallery__item gallery__item--portrait">
          <img
            src="assets/images/projekt1.png"
          />
          <figcaption>
            <span class="gallery__title">Postutlysning</span>
            <span class="gallery__detail">Akademiska Föreningen</span>
          </figcaption>
          <a
  class="gallery__link"
  href="https://joannabartczak.notion.site/1"
  target="_top"
></a>
        </figure>

        <figure class="gallery__item">
          <img
            src="assets/images/projekt2.png"
          />
          <figcaption>
            <span class="gallery__title">Spegatspexfonden</span>
            <span class="gallery__detail">Akademiska Föreningen</span>
          </figcaption>
          <a
            class="gallery__link"
            href="https://joannabartczak.notion.site/2"
          ></a>
        </figure>

        <figure class="gallery__item">
          <img
            src="assets/images/projekt3.png"
          />
          <figcaption>
            <span class="gallery__title">OT-fonden</span>
            <span class="gallery__detail">Akademiska Föreningen</span>
          </figcaption>
          <a
            class="gallery__link"
            href="https://joannabartczak.notion.site/3"
          ></a>
        </figure>
      </section>
    </main>
  </body>
</html>
