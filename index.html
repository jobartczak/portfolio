<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Field Notes — a six-image collection of quiet landscapes."
    />
    <title>Field Notes — Image Showcase</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="showcase">
      <header class="showcase__header">
        <p class="eyebrow">Collected landscapes · Vol. 01</p>
        <h1>Joanna</h1>
        <p class="introduction">
          Six studies in stillness, gathered between open water and high ground.
        </p>
      </header>

      <section class="gallery" aria-label="Field Notes image collection">
        <figure class="gallery__item gallery__item--portrait">
          <img
            src="https://www.google.com/imgres?q=dog&imgurl=https%3A%2F%2Fhips.hearstapps.com%2Fhmg-prod%2Fimages%2Fc33b2259-8c6b-4308-bc6f-5373d8a6600d.jpeg%3Fcrop%3D0.668xw%3A1.00xh%3B0.194xw%2C0%26resize%3D640%3A*&imgrefurl=https%3A%2F%2Fwww.goodhousekeeping.com%2Frelationships%2Fpets%2Fg1825%2Fmedium-sized-dogs%2F&docid=DT2WdBqpb6rvSM&tbnid=15Ri31TRV8G3WM&vet=12ahUKEwigvLn_wJaWAxVe-wIHHRn7HuQQnPAOegQIOBAA..i&w=640&h=639&hcb=2&ved=2ahUKEwigvLn_wJaWAxVe-wIHHRn7HuQQnPAOegQIOBAA"
            alt="A quiet coast framed by cliffs and pale sky"
            title="Field Notes"
          />
          <figcaption>
            <span class="gallery__title">Field Notes</span>
            <span class="gallery__detail">Coastal Study · 01</span>
          </figcaption>
          <a
            class="gallery__link"
            href="https://joannabartczak.notion.site/1?source=copy_link"
            aria-label="View Coastal Study full size"
          ></a>
        </figure>

        <figure class="gallery__item">
          <img
            src="assets/images/mountains.jpg"
            alt="A broad mountain range beneath shifting clouds"
            title="Field Notes"
          />
          <figcaption>
            <span class="gallery__title">Field Notes</span>
            <span class="gallery__detail">High Country · 02</span>
          </figcaption>
          <a
            class="gallery__link"
            href="assets/images/mountains.jpg"
            aria-label="View High Country full size"
          ></a>
        </figure>

        <figure class="gallery__item">
          <img
            src="assets/images/forest.jpg"
            alt="Sunlight filtering through a dense green forest"
            title="Field Notes"
          />
          <figcaption>
            <span class="gallery__title">Field Notes</span>
            <span class="gallery__detail">Understory · 03</span>
          </figcaption>
          <a
            class="gallery__link"
            href="assets/images/forest.jpg"
            aria-label="View Understory full size"
          ></a>
        </figure>

        <figure class="gallery__item">
          <img
            src="assets/images/desert.jpg"
            alt="A winding road crossing a warm desert landscape"
            title="Field Notes"
          />
          <figcaption>
            <span class="gallery__title">Field Notes</span>
            <span class="gallery__detail">Open Road · 04</span>
          </figcaption>
          <a
            class="gallery__link"
            href="assets/images/desert.jpg"
            aria-label="View Open Road full size"
          ></a>
        </figure>

        <figure class="gallery__item">
          <img
            src="assets/images/lake.jpg"
            alt="A still alpine lake surrounded by rugged mountains"
            title="Field Notes"
          />
          <figcaption>
            <span class="gallery__title">Field Notes</span>
            <span class="gallery__detail">Cold Water · 05</span>
          </figcaption>
          <a
            class="gallery__link"
            href="assets/images/lake.jpg"
            aria-label="View Cold Water full size"
          ></a>
        </figure>

        <figure class="gallery__item gallery__item--portrait">
          <img
            src="assets/images/valley.jpg"
            alt="A green valley opening toward distant peaks"
            title="Field Notes"
          />
          <figcaption>
            <span class="gallery__title">Field Notes</span>
            <span class="gallery__detail">Valley Light · 06</span>
          </figcaption>
          <a
            class="gallery__link"
            href="assets/images/valley.jpg"
            aria-label="View Valley Light full size"
          ></a>
        </figure>
      </section>

      <footer class="showcase__footer">
        <span>Six frames</span>
        <span aria-hidden="true">↘</span>
        <span>One quiet collection</span>
      </footer>
    </main>
  </body>
</html>
