<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Field Notes — a six-image collection of quiet landscapes."
    />
    <title>Field Notes — Image Showcase</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="showcase">
      <section class="gallery" aria-label="Field Notes image collection">
        <figure class="gallery__item gallery__item--portrait">
          <img
            src="https://drive.google.com/file/d/1AhN1lT_Lzi0UiLwY-3rLyhr18424-ZM3/view?usp=sharing"
          />
          <figcaption>
            <span class="gallery__title">Postutlysning</span>
            <span class="gallery__detail">Akademiska Föreningen</span>
          </figcaption>
          <a
  class="gallery__link"
  href="https://joannabartczak.notion.site/1"
  target="_top"
  aria-label="View Coastal Study"
></a>
        </figure>

        <figure class="gallery__item">
          <img
            src="https://drive.google.com/file/d/13CY1fKWZzy5ROXkqeHLkha6woam7fASz/view?usp=sharing"
          />
          <figcaption>
            <span class="gallery__title">Spegatspexfonden</span>
            <span class="gallery__detail">Akademiska Föreningen</span>
          </figcaption>
          <a
            class="gallery__link"
            href="https://joannabartczak.notion.site/2"
            aria-label="View High Country full size"
          ></a>
        </figure>

        <figure class="gallery__item">
          <img
            src="https://drive.google.com/file/d/1QT8EzTQ-DvlHbSrbInyZo8gJC8UTTK1B/view?usp=sharing"
          />
          <figcaption>
            <span class="gallery__title">OT-fonden</span>
            <span class="gallery__detail">Akademiska Föreningen</span>
          </figcaption>
          <a
            class="gallery__link"
            href="https://joannabartczak.notion.site/3"
            aria-label="View Understory full size"
          ></a>
        </figure>
      </section>
    </main>
  </body>
</html>
